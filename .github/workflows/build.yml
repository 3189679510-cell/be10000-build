name: Build ImmortalWrt for Xiaomi BE10000

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-distutils rsync unzip zlib1g-dev file wget

      - name: Clone ImmortalWrt
        run: git clone --depth 1 https://github.com/immortalwrt/immortalwrt.git openwrt

      - name: Update feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Apply config
        run: |
          cp configs/be10000.config openwrt/.config
          cd openwrt
          make defconfig

      - name: Download packages
        run: cd openwrt && make download -j8

      - name: Build
        run: cd openwrt && make -j$(nproc) V=s

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: be10000-firmware
          path: |
            openwrt/bin/targets/**/*.bin
            openwrt/bin/targets/**/*.ubi
            openwrt/bin/targets/**/sha256sums
